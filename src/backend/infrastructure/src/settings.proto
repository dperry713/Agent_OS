syntax = "proto3";

package settings_pb;

message Empty {}

message GetDarkThemeResponse {
  bool is_dark = 1;
}

message SetDarkThemeRequest {
  bool is_dark = 1;
}

service SettingsService {
  rpc GetDarkTheme(Empty) returns (GetDarkThemeResponse);
  rpc SetDarkTheme(SetDarkThemeRequest) returns (Empty);
}
