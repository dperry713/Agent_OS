name: Security Audit

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
      
    - name: Run Cargo Audit
      run: cargo audit
